<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="55%" r="48%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="224" height="224" rx="48" fill="url(#bgGlow)" stroke="#e2e8f0" stroke-width="3"/>
  <!-- Impact burst -->
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round">
    <line x1="72" y1="118" x2="54" y2="106"/>
    <line x1="168" y1="118" x2="186" y2="106"/>
    <line x1="88" y1="98" x2="76" y2="80"/>
    <line x1="152" y1="98" x2="164" y2="80"/>
  </g>
  <!-- Poop emoji (slightly squashed under impact) -->
  <text x="120" y="182" text-anchor="middle" font-size="82" transform="scale(1.06, 0.90) translate(-7, 20)">💩</text>
  <!-- Impact spark -->
  <text x="118" y="128" text-anchor="middle" font-size="38">💥</text>
  <!-- Hammer emoji swinging down -->
  <text x="148" y="96" text-anchor="middle" font-size="76" transform="rotate(-24 148 96)">🔨</text>
</svg>